name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so two runs never publish the APK at once.
concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Keep one signing key across builds so new versions install over old ones.
      - name: Restore signing key
        id: key
        uses: actions/cache@v4
        with:
          path: android/tof-signing.jks
          key: tof-signing-key-v1

      - name: Create signing key
        if: steps.key.outputs.cache-hit != 'true'
        run: keytool -genkeypair -keystore android/tof-signing.jks -storetype PKCS12 -alias tof -keyalg RSA -keysize 2048 -validity 10000 -storepass tofsigning -keypass tofsigning -dname "CN=Tof"

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      # Each build is also published as tof-<version>.apk, so downloads on the phone never clash.
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"/\1/p' android/app/build.gradle)
          apk="tof-$version.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          cp "$apk" tof.apk
          notes="Tof $version, built from ${GITHUB_SHA::7}. On your phone, download $apk and open it to install. tof.apk is always the newest version."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android "$apk" tof.apk --clobber
            gh release edit android --notes "$notes"
          else
            gh release create android "$apk" tof.apk --title "Tof for Android" --notes "$notes" --target "$GITHUB_SHA"
          fi
          echo "APK=$apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: tof-apk
          path: ${{ env.APK }}
