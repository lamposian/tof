plugins {
    id "com.android.application"
}

android {
    namespace "io.github.lamposian.tof"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.lamposian.tof"
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName "0.6"
    }

    // CI keeps this key between builds so updates install over the previous version.
    def signingFile = rootProject.file("tof-signing.jks")
    if (signingFile.exists()) {
        signingConfigs {
            debug {
                storeFile signingFile
                storePassword "tofsigning"
                keyAlias "tof"
                keyPassword "tofsigning"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The web app at the repo root is bundled as the app's assets.
    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir("webassets")
    }
}

def copyWeb = tasks.register("copyWeb", Copy) {
    from(rootProject.projectDir.parentFile) {
        include "index.html", "app.js", "manifest.webmanifest", "icon-192.png", "icon-512.png"
    }
    into layout.buildDirectory.dir("webassets")
}
tasks.named("preBuild") { dependsOn copyWeb }

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
