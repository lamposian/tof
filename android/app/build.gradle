plugins {
    id "com.android.application"
}

android {
    namespace "io.github.lamposian.tof"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.lamposian.tof"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The web app at the repo root is bundled as the app's assets.
    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir("webassets")
    }
}

def copyWeb = tasks.register("copyWeb", Copy) {
    from(rootProject.projectDir.parentFile) {
        include "index.html", "manifest.webmanifest", "icon-192.png", "icon-512.png"
    }
    into layout.buildDirectory.dir("webassets")
}
tasks.named("preBuild") { dependsOn copyWeb }

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
